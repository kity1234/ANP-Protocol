<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="760" fill="#0f1117"/>

  <text x="500" y="45" text-anchor="middle" fill="#f5f5f5" font-size="26" font-weight="bold">SANP — Semantic Artificial Network Protocol</text>
  <text x="500" y="72" text-anchor="middle" fill="#9aa0ab" font-size="15">6 couches numérotées + 1 couche transversale de gouvernance</text>

  <!-- Layer boxes bottom(0) to top(5), stacked -->
  <!-- Layer 0 -->
  <g>
    <rect x="80" y="620" width="680" height="80" rx="10" fill="#1b2838" stroke="#3a4a5c" stroke-width="1.5"/>
    <text x="105" y="650" fill="#7fd3ff" font-size="16" font-weight="bold">Couche 0 — Thermodynamique &amp; Énergétique</text>
    <text x="105" y="672" fill="#c7cdd6" font-size="13">Budget FLOPs/carbone — module la profondeur du raisonnement</text>
  </g>

  <!-- Layer 1 -->
  <g>
    <rect x="80" y="530" width="680" height="80" rx="10" fill="#1c2b2a" stroke="#3a5c56" stroke-width="1.5"/>
    <text x="105" y="560" fill="#7fffd4" font-size="16" font-weight="bold">Couche 1 — Infrastructure &amp; Calcul</text>
    <text x="105" y="582" fill="#c7cdd6" font-size="13">Standardisation matérielle (GPU/TPU), format d'échange de tenseurs (ONNX)</text>
  </g>

  <!-- Layer 2 -->
  <g>
    <rect x="80" y="440" width="680" height="80" rx="10" fill="#2a2318" stroke="#5c4c33" stroke-width="1.5"/>
    <text x="105" y="470" fill="#ffd27f" font-size="16" font-weight="bold">Couche 2 — Routage Cognitif</text>
    <text x="105" y="492" fill="#c7cdd6" font-size="13">Routage par compétence (embedding), certificat de compétence par modèle</text>
  </g>

  <!-- Layer 3 -->
  <g>
    <rect x="80" y="350" width="680" height="80" rx="10" fill="#231d2e" stroke="#4c3e5c" stroke-width="1.5"/>
    <text x="105" y="380" fill="#d3a6ff" font-size="16" font-weight="bold">Couche 3 — Interaction &amp; Appels d'Outils</text>
    <text x="105" y="402" fill="#c7cdd6" font-size="13">Agents ↔ monde extérieur (API, MCP, autres modèles)</text>
  </g>

  <!-- Layer 4 -->
  <g>
    <rect x="80" y="260" width="680" height="80" rx="10" fill="#2e1d20" stroke="#5c3e42" stroke-width="1.5"/>
    <text x="105" y="290" fill="#ff9fae" font-size="16" font-weight="bold">Couche 4 — Sémantique &amp; Contexte Partagé</text>
    <text x="105" y="312" fill="#c7cdd6" font-size="13">Ancres d'espace latent + fallback auto-correcteur vers couche 2</text>
  </g>

  <!-- Layer 5 -->
  <g>
    <rect x="80" y="170" width="680" height="80" rx="10" fill="#1d2a2e" stroke="#3e565c" stroke-width="1.5"/>
    <text x="105" y="200" fill="#8fd6ff" font-size="16" font-weight="bold">Couche 5 — Mémoire Persistante</text>
    <text x="105" y="222" fill="#c7cdd6" font-size="13">Mémoire épisodique (ticket de session) + mémoire sémantique (embedding du monde)</text>
  </g>

  <!-- Transversal governance layer -->
  <g>
    <rect x="800" y="170" width="120" height="530" rx="10" fill="#241417" stroke="#6c2f36" stroke-width="1.5"/>
    <text x="860" y="400" text-anchor="middle" fill="#ff7f8c" font-size="15" font-weight="bold" transform="rotate(90 860 400)">Couche T — Gouvernance &amp; Vérification</text>
  </g>

  <!-- Arrows between stacked layers -->
  <g stroke="#5a6270" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="420" y1="620" x2="420" y2="612"/>
    <line x1="420" y1="530" x2="420" y2="522"/>
    <line x1="420" y1="440" x2="420" y2="432"/>
    <line x1="420" y1="350" x2="420" y2="342"/>
    <line x1="420" y1="260" x2="420" y2="252"/>
  </g>

  <!-- Fallback arrow layer4 -> layer2 -->
  <path d="M 770 290 C 850 290, 850 460, 770 460" stroke="#ff9fae" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrowpink)"/>
  <text x="885" y="380" fill="#ff9fae" font-size="11" text-anchor="middle">fallback</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5a6270"/>
    </marker>
    <marker id="arrowpink" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ff9fae"/>
    </marker>
  </defs>

  <text x="500" y="735" text-anchor="middle" fill="#6b7280" font-size="12">SANP v0.1 — draft ouvert à discussion</text>
</svg>
